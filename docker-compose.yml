services:
  stock-web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tdx-stock-web
    ports:
      - "18080:8080"
    volumes:
      - ./data:/app/data
      - ./config.yaml:/app/config.yaml:ro
    restart: unless-stopped
    environment:
      - TZ=Asia/Shanghai
      # 任务调度见 config.yaml（环境变量可覆盖单个任务，见 config.yaml 头部注释）
      # 企微通知 key（涉密，不要提交到仓库）：
      # - WECOM_WEBHOOK=https://qyapi.weixin.qq.com/cgi-bin/webhook/send?key=xxx
    networks:
      - stock-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    labels:
      - "com.stock.description=TDX Stock Data Query System"
      - "com.stock.version=1.0.0"

networks:
  stock-network:
    driver: bridge

