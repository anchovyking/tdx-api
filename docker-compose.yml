services:
  stock-web:
    build:
      context: .
      dockerfile: Dockerfile
    # 构建出的镜像名，直接推送到局域网 registry（免认证）
    image: 192.168.0.201:5000/anchovyprivate/tdx-api-stock-web:latest
    container_name: tdx-stock-web
    ports:
      - "18080:8080"
    volumes:
      - ./data:/app/data
      - ./config.yaml:/app/config.yaml:ro
    restart: unless-stopped
    environment:
      - TZ=Asia/Shanghai
      # 任务调度见 config.yaml（环境变量可覆盖单个任务，见 config.yaml 头部注释）
      # 企微通知 key 透传（无值=取宿主机环境变量，密钥不进仓库）：
      # 宿主机先执行 export WECOM_WEBHOOK="https://qyapi.weixin.qq.com/cgi-bin/webhook/send?key=xxx"
      #- WECOM_WEBHOOK
    networks:
      - stock-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    labels:
      - "com.stock.description=TDX Stock Data Query System"
      - "com.stock.version=1.0.0"

networks:
  stock-network:
    driver: bridge

